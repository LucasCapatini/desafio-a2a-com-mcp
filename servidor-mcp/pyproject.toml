[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "servidor-mcp"
version = "1.0.0"
description = "Servidor MCP da Central de Salas (Streamable HTTP, stateless, MRTR)"
requires-python = ">=3.10"
dependencies = [
    "mcp==2.3.0",
    "starlette==1.7.0",
    "uvicorn==0.54.0",
]

[tool.setuptools]
packages = ["servidor_mcp"]
